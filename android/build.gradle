
group = "co.reader.yaqut_reader_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.3.0")
        classpath 'com.google.gms:google-services:4.3.10'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        // Onyx Boox SDK — needed at runtime for the reader's pen integration on
        // Boox e-ink devices. Inert on non-Boox devices: PenInputControllerFactory
        // probes class availability via Class.forName before touching the SDK.
        maven { url 'https://repo.boox.com/repository/maven-public/' }
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "co.reader.yaqut_reader_flutter"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {

        implementation 'co.yaqut.reader:reader:1.7.36'
        // Exposed as `api` so the consuming Flutter app gets the Onyx classes on
        // its runtime classpath without re-declaring the dep itself —
        // PenInputControllerFactory.isOnyxSdkAvailable() requires com.onyx.android.sdk
        // to be reachable at runtime, otherwise pen integration is silently disabled.
        api 'com.onyx.android.sdk:onyxsdk-pen:1.5.4'
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'com.github.skydoves:expandablelayout:1.0.7'
        implementation 'com.squareup.picasso:picasso:2.71828'
        implementation 'jp.wasabeef:picasso-transformations:2.4.0'
        implementation 'org.greenrobot:eventbus:3.3.1'
        implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
        implementation "androidx.media3:media3-exoplayer:1.4.1"
        implementation "androidx.media3:media3-ui:1.4.1"
        implementation "androidx.media3:media3-common:1.4.1"
        implementation "androidx.media3:media3-session:1.4.1"
        implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
        implementation 'com.google.code.gson:gson:2.8.6'
        def multidex_version = "2.0.1"
        implementation "androidx.multidex:multidex:$multidex_version"

        // OkHttp for download functionality
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}